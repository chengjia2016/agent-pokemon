server:
  host: 0.0.0.0
  port: 10000

database:
  host: localhost
  port: 5432
  user: postgres
  password: "${DB_PASSWORD}"  # Use environment variable for production
  dbname: agent_monster
  sslmode: disable

github:
  token: "${GITHUB_TOKEN}"  # Use environment variable for production
  owner: chengjia2016
  repo: agent-monster

settlement:
  daily_time: "00:00"
  sync_to_github: false
  sync_interval_seconds: 300

rate_limit:
  enabled: true
  requests_per_minute: 1000
  burst_size: 50

